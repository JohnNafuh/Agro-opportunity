<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agro Opportunity</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Agro Opportunity</h1>
        <p>Location-Based Agricultural Intelligence</p>
    </header>

    <main>

        <section id="location-section">

            <h2>Choose Your Location</h2>

            <input
                type="text"
                id="location"
                placeholder="Enter city, state or region"
            >

            <button id="locationBtn">
                Analyze Location
            </button>

        </section>


        <section id="results-section">

            <h2>Market Opportunity</h2>

            <div id="results">

                <p>
                    Enter a location to begin analysis.
                </p>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
